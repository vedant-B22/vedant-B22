<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Vedant Baviskar — builds brands and the software behind them" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8C9A0"/><stop offset="1" stop-color="#C79A63"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C79A63" stroke-opacity=".08"/>
    </pattern>
    <radialGradient id="glow" cx=".82" cy=".1" r=".6">
      <stop offset="0" stop-color="#C79A63" stop-opacity=".35"/><stop offset="1" stop-color="#C79A63" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .t{font-family:'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(340px)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.scan,.pulse{animation:none}}
  </style>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect class="scan" width="1200" height="2" fill="#C79A63" opacity=".18"/>
  <text class="t" x="70" y="150" font-size="84" font-weight="800" letter-spacing="-3" fill="#F2EDE4">Vedant Baviskar</text>
  <rect x="72" y="176" width="150" height="5" rx="2.5" fill="url(#sand)"/>
  <text class="t" x="72" y="226" font-size="26" fill="#9AA4B2">I build brands, and the software they run on.</text>
  <text class="m" x="72" y="266" font-size="18" fill="#C79A63">CEO, Vesa Studios  /  Mechatronics, SSPU  /  Pune</text>
  <g class="pulse"><circle cx="1090" cy="90" r="7" fill="#C79A63"/></g>
  <text class="m" x="1010" y="95" font-size="15" fill="#9AA4B2" text-anchor="end">shipping</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
